{% extends 'base.html' %}

{% block title %}Confirm Deletion — NewsBlog{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-5">
        <div class="delete-confirm-card">
            <div class="delete-confirm-card__icon">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h1 class="delete-confirm-card__title">Delete Article</h1>
            <p class="text-muted small">
                Are you sure you want to permanently delete this article? This action cannot be undone.
            </p>

            <div class="delete-confirm-card__quote">
                &ldquo;{{ news.title }}&rdquo;
            </div>

            <form method="POST" class="d-flex justify-content-center gap-3 mt-3">
                {% csrf_token %}
                <a href="{% url 'news_detail' news.id %}" class="btn-editorial btn-editorial--outline">
                    Cancel
                </a>
                <button type="submit" class="btn-editorial btn-editorial--danger">
                    <i class="bi bi-trash3"></i> Yes, Delete Article
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
